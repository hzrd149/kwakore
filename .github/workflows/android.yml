name: android

# Desktop leads, but Android shares the whole backend. Pull requests that touch
# shared backend or Android code run only the gomobile AAR bind (the aar job),
# so a backend change that breaks the Android build fails before merge. The full
# APK build (the apk job) runs on manual dispatch and on v* tags, where it also
# attaches the APK to the release.
#
# The aar job uses the plain pull_request event (never pull_request_target)
# because it runs code from forks: it gets a read-only token and no secrets.
on:
  pull_request:
    paths:
      - "backend/**"
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

# a newer push to the same pull request cancels the in-flight aar run; tag and
# dispatch runs are never cancelled
concurrency:
  group: android-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # same x/mobile as backend/go.mod, gomobile must match the runtime
  XMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e
  # gomobile bind needs the ndk to cross-compile the cgo parts
  NDK_VERSION: 27.2.12479018

jobs:
  # pull requests: bind backend/mobile to an aar and throw it away. No gradle,
  # so Kotlin breakage from a backend/mobile API change still only shows on the
  # apk job (recorded residual risk).
  aar:
    name: aar
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # gomobile bind needs a jdk and android.jar besides the ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: install sdk packages
        run: |
          sdkmanager "platforms;android-35" "ndk;$NDK_VERSION"
          yes | sdkmanager --licenses > /dev/null

      - name: install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$XMOBILE_VERSION
          go install golang.org/x/mobile/cmd/gobind@$XMOBILE_VERSION
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: bind backend to aar
        working-directory: backend
        run: |
          gomobile init
          gomobile bind -target=android -androidapi 26 -o "$RUNNER_TEMP/backend.aar" ./mobile

  apk:
    name: apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: install sdk packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          yes | sdkmanager --licenses > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$XMOBILE_VERSION
          go install golang.org/x/mobile/cmd/gobind@$XMOBILE_VERSION
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: bind backend to aar
        working-directory: backend
        run: |
          gomobile init
          mkdir -p ../android/app/libs
          gomobile bind -target=android -androidapi 26 -o ../android/app/libs/backend.aar ./mobile

      # the apk picks backend.aar up from app/libs
      - name: assemble
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: name apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk verdana-android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: verdana-apk
          path: verdana-android-debug.apk
          if-no-files-found: error

      - name: attach apk to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: verdana-android-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
