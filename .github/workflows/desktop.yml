name: desktop

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-build-deps

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            backend/go.sum

      # the napplet frame-scope and host-page tests run in node; the runner
      # image ships it, and this fails fast if it ever stops doing so
      - name: check node
        run: node --version

      - name: test backend
        working-directory: backend
        # node-backed tests must not skip silently in CI
        env:
          VERDANA_REQUIRE_NODE: "1"
        run: go test ./...

      - name: validate shell installer
        run: bash -n scripts/install.sh

      # the launcher embeds libwebview from internal/webviewlib/lib, which is
      # copied out of the pinned go-webview module and never committed
      - name: copy libwebview
        working-directory: desktop
        run: go generate ./internal/webviewlib

      # embed_prod.go embeds child/child, so the child has to exist before the
      # desktop package can even be compiled on a fresh checkout
      - name: build child
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: go build -o child/child ./child

      - name: test desktop
        working-directory: desktop
        run: go test -tags novulkan ./...

  # the instance pipe, childbin and keyring code have Windows-only paths that
  # the linux job never compiles, and the build matrix only builds them. This
  # job vets the backend and the whole desktop module for Windows and runs the
  # backend and desktop internal tests on a real Windows machine. Everything
  # builds without cgo, so no mingw is needed. One command per step: the
  # default PowerShell shell only fails a step on the last command's exit code
  test-windows:
    name: test (windows)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      # Git for Windows may check text files out with CRLF, which would change
      # fixtures and golden strings; this has to run before the checkout
      - name: keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            backend/go.sum

      - name: vet backend
        working-directory: backend
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      # VERDANA_REQUIRE_NODE stays unset here: the node-backed tests run when
      # node works on the runner and skip instead of failing when it does not
      - name: test backend
        working-directory: backend
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      # libwebview copies for the launcher to embed (git-ignored). No
      # GOOS/GOARCH here: go generate runs its copy program on the runner
      - name: copy libwebview
        working-directory: desktop
        run: go generate ./internal/webviewlib

      # embed_prod.go embeds child/child, so the child has to exist before the
      # desktop package can be vetted
      - name: build child
        working-directory: desktop
        env:
          CGO_ENABLED: "0"
        run: go build -o child/child ./child

      - name: vet desktop
        working-directory: desktop
        env:
          CGO_ENABLED: "0"
        run: go vet -tags novulkan ./...

      # instanceipc (owner-only named pipe, server SID check), childbin,
      # wireline, webviewlib, secretstore, osintegration and the rest
      - name: test desktop internal packages
        working-directory: desktop
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/...

  build:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            id: linux-amd64
            goos: linux
            goarch: amd64
            cgo: "1"
            binary: verdana
          - os: ubuntu-24.04-arm
            id: linux-arm64
            goos: linux
            goarch: arm64
            cgo: "1"
            binary: verdana
          - os: windows-2022
            id: windows-amd64
            goos: windows
            goarch: amd64
            cgo: "1"
            binary: verdana.exe
          # Gio and the Windows webview host compile without cgo. Building on
          # Linux avoids depending on the limited Windows ARM runner pool.
          - os: ubuntu-24.04
            id: windows-arm64
            goos: windows
            goarch: arm64
            cgo: "0"
            binary: verdana.exe
          - os: macos-15-intel
            id: darwin-amd64
            goos: darwin
            goarch: amd64
            cgo: "1"
            binary: verdana
          - os: macos-15
            id: darwin-arm64
            goos: darwin
            goarch: arm64
            cgo: "1"
            binary: verdana

    steps:
      - uses: actions/checkout@v4

      # gio (wayland/x11 + egl) and go-webview (gtk3 + webkit2gtk 4.1) are cgo
      - name: linux deps
        if: matrix.goos == 'linux'
        uses: ./.github/actions/linux-build-deps

      - name: windows deps
        if: matrix.goos == 'windows' && matrix.cgo == '1'
        run: |
          choco install --yes --no-progress mingw
          echo "C:\ProgramData\mingw64\mingw64\bin" >> $env:GITHUB_PATH
          echo "CC=gcc" >> $env:GITHUB_ENV

      - name: validate powershell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            backend/go.sum

      - name: download modules
        working-directory: .
        run: |
          cd backend && go mod download
          cd ../desktop && go mod download

      # libwebview copies for the launcher to embed (git-ignored). No
      # GOOS/GOARCH here: go generate runs its copy program on the runner
      - name: copy libwebview
        working-directory: desktop
        run: go generate ./internal/webviewlib

      # the child (the webview host) is embedded into the main binary by
      # embed_prod.go, so it has to be built for the same target first
      - name: build child
        working-directory: desktop
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -o child/child ./child

      - name: build verdana
        working-directory: desktop
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -o ${{ matrix.binary }} -tags novulkan -ldflags "-s -w -X verdana/backend.Version=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}" .

      - name: package
        shell: bash
        working-directory: desktop
        run: |
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv verdana.exe dist/verdana.exe
            7z a "dist/verdana-${{ matrix.id }}.zip" ./dist/verdana.exe
            rm dist/verdana.exe
          else
            mv verdana dist/verdana
            tar czf "dist/verdana-${{ matrix.id }}.tar.gz" -C dist verdana
            rm dist/verdana
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: verdana-${{ matrix.id }}
          path: desktop/dist/*
          if-no-files-found: error

  release:
    name: release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: write checksums
        working-directory: dist
        run: sha256sum verdana-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
