name: linux

# Kwakore is a per-user Linux service: kwakore, the kwakore CLI, the
# napplet child and libwebview.so, shipped side by side. There is no Windows,
# macOS, Android or Gio launcher build any more (D-09, D-10).
#
# backend and child run the Go suites on every push and pull request. bundle
# (amd64, arm64) and release run only on v* tags, and nothing publishes unless
# both Go lanes and both bundles passed.
#
# By user decision (quick task 261007-ej4), CI runs no real-engine, systemd or
# Nix lane: the display-backed TestWebKit* tests (KWAKORE_WEBKIT_SMOKE=1), the
# backend's TestRPCRealChildGraphical (KWAKORE_REQUIRE_GRAPHICS=1), the user
# service and installed-artifact smokes and the Nix checks run locally; see
# AGENTS.md for the commands. Comments may name those gates, because
# TestCIWorkflowContract (backend/daemon) ignores comment lines and fails if
# one of them comes back in a step.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail, so a failing test in front of a tee fails the step
    shell: bash

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # the installer and smoke scripts parse, and every supported path (code,
      # units, Nix, CI, docs) uses only the kwakore name outside the reviewed
      # exceptions in scripts/check-product-identity.sh
      - name: check shell scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: product identity (full)
        run: bash scripts/check-product-identity.sh

      # the napplet frame-scope and host-page tests run in node; the runner
      # image ships it, and this fails fast if it ever stops doing so
      - name: check node
        run: node --version

      - name: vet backend
        working-directory: backend
        run: go vet ./...

      - name: test backend
        working-directory: backend
        # node-backed tests must not skip silently in CI
        env:
          KWAKORE_REQUIRE_NODE: "1"
        run: go test ./...

  child:
    name: child
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-build-deps

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      # the child loads libwebview.so from beside itself; the copies come from
      # the pinned go-webview module and are never committed
      - name: generate libwebview copies
        working-directory: desktop
        run: go generate ./internal/webviewlib

      - name: build napplet child
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: go build -o child/kwaklet ./child

      - name: vet desktop
        working-directory: desktop
        run: go vet ./...

      - name: test desktop
        working-directory: desktop
        run: go test ./...

      # CI has no display, so the display-backed TestWebKit* tests and the
      # backend's TestRPCRealChildGraphical skip behind their env gates. This
      # notice says so on every run, so a green child job is never read as
      # graphical coverage. TestWebKitHardeningSymbolsResolve needs no display
      # and runs in the step above.
      - name: real-engine tests are local-only
        working-directory: desktop
        run: |
          tests=$(go test ./child -list '^TestWebKit' | grep '^TestWebKit' | grep -vx 'TestWebKitHardeningSymbolsResolve' | tr '\n' ' ')
          echo "not run in CI: $tests TestRPCRealChildGraphical"
          echo "::notice title=real-engine tests not run::the display-backed TestWebKit tests ($tests) and the backend's TestRPCRealChildGraphical were skipped because CI has no display; run them locally per AGENTS.md \"Local-only real-engine tests\""

      # the retired Gio launcher, Android app, gomobile bindings, settings
      # window and non-Linux build paths (D-09, D-10) stay deleted: none of
      # them may come back, both modules stay tidy, and building and testing
      # write only ignored outputs
      - name: retired paths stay deleted
        run: |
          set -euo pipefail
          retired=(
            android backend/mobile backend/tools.go backend/window_settings.go
            backend/webview/napplet-settings.html backend/webview/napplet-settings.js
            desktop/child/settings.go desktop/child/program_napp.go desktop/child/napp
            desktop/internal/childbin desktop/internal/icon desktop/internal/instanceipc
            desktop/internal/instancelock desktop/internal/osintegration desktop/internal/secretstore
            desktop/internal/themesystem desktop/internal/windowchrome
            .github/workflows/android.yml .github/workflows/desktop.yml scripts/install.ps1
          )
          for path in "${retired[@]}"; do
            if [ -e "$path" ]; then echo "retired path is back: $path"; exit 1; fi
          done
          if compgen -G 'desktop/*.go' >/dev/null; then
            echo "the retired desktop root package is back: $(ls desktop/*.go)"
            exit 1
          fi
          (cd backend && go mod tidy -diff)
          (cd desktop && go mod tidy -diff)
          dirty=$(git status --porcelain --untracked-files=all)
          [ -z "$dirty" ] || { echo "the build left unignored files:"; echo "$dirty"; exit 1; }

  # one native job per architecture; each writes only its own archive name,
  # so the two never race on an output file. It builds only for tagged
  # releases.
  bundle:
    name: bundle (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-build-deps

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            backend/go.sum

      # two builds into fresh directories must give the same bytes, exactly
      # the four files, a matching SHA256SUMS and a child that refuses a bad
      # WEBVIEW_PATH and resolves WebKitGTK on this host
      - name: bundle smoke
        run: |
          log="$RUNNER_TEMP/kwakore-bundle.log"
          bash scripts/smoke-linux-service.sh --bundle-only | tee "$log"
          for marker in bundle child; do
            want=$(grep -c "pass \"$marker:" scripts/smoke-linux-service.sh)
            got=$(grep -c "^PASS $marker:" "$log" || true)
            [ "$want" -gt 0 ] && [ "$got" = "$want" ] || { echo "expected $want PASS $marker lines, got $got"; exit 1; }
          done

      - name: build release bundle
        env:
          ARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$(uname -m)" in
          x86_64) host=amd64 ;;
          aarch64) host=arm64 ;;
          *) echo "unexpected runner machine $(uname -m)"; exit 1 ;;
          esac
          [ "$host" = "$ARCH" ] || { echo "runner is $host, matrix wants $ARCH"; exit 1; }
          # tags give the release version (stamped into kwakore/backend.Version
          # and the daemon's version output); other runs a commit version
          if [ "$REF_TYPE" = tag ]; then
            version=$REF_NAME
          else
            version="0.0.0-$(git rev-parse --short=12 HEAD)"
          fi
          bash scripts/build-linux-bundle.sh --arch "$ARCH" --version "$version" --out "$RUNNER_TEMP/dist"
          release="$RUNNER_TEMP/dist/$version"
          (cd "$release" && sha256sum --strict -c SHA256SUMS)
          [ "$("$release/kwakore-$version-linux-$ARCH/kwakore" version)" = "$version" ] ||
            { echo "bundled daemon does not report $version"; exit 1; }
          # this architecture's manifest names only kwakore files: exactly
          # the archive, its checksum line and the four bundle members
          top="kwakore-$version-linux-$ARCH"
          [ "$(cut -d' ' -f3- "$release/SHA256SUMS")" = "kwakore-linux-$ARCH.tar.gz" ] ||
            { echo "SHA256SUMS does not name exactly kwakore-linux-$ARCH.tar.gz"; exit 1; }
          members=$(tar -tzf "$release/kwakore-linux-$ARCH.tar.gz" | LC_ALL=C sort | tr '\n' ' ')
          [ "$members" = "$top/kwak $top/kwaklet $top/kwakore $top/libwebview.so " ] ||
            { echo "kwakore-linux-$ARCH.tar.gz does not hold exactly the four kwakore files: $members"; exit 1; }
          if tar -tzf "$release/kwakore-linux-$ARCH.tar.gz" | grep -i 'verd''ana'; then
            echo "kwakore-linux-$ARCH.tar.gz names the old product"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/upload"
          cp "$release/kwakore-linux-$ARCH.tar.gz" "$RUNNER_TEMP/upload/"
          # this job's own checksum line; the release job joins both
          cp "$release/SHA256SUMS" "$RUNNER_TEMP/upload/kwakore-linux-$ARCH.sha256"
          printf '%s\n' "$version" >"$RUNNER_TEMP/upload/kwakore-linux-$ARCH.version"

      - uses: actions/upload-artifact@v4
        with:
          name: kwakore-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/upload/*
          if-no-files-found: error

  release:
    name: release
    needs: [backend, child, bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kwakore-linux-*
          path: dist
          merge-multiple: true

      # The published names are what scripts/install.sh downloads:
      # kwakore-linux-ARCH.tar.gz verified against SHA256SUMS. Anything else,
      # including an archive of the old product, fails the release.
      - name: assemble release manifest
        working-directory: dist
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archs=(amd64 arm64)
          for arch in "${archs[@]}"; do
            [ "$(cat "kwakore-linux-$arch.version")" = "$VERSION" ] ||
              { echo "kwakore-linux-$arch was built as $(cat "kwakore-linux-$arch.version"), not $VERSION"; exit 1; }
            [ "$(wc -l <"kwakore-linux-$arch.sha256")" = 1 ] || { echo "kwakore-linux-$arch.sha256 is not one line"; exit 1; }
            sha256sum --strict -c "kwakore-linux-$arch.sha256"
            rm "kwakore-linux-$arch.sha256" "kwakore-linux-$arch.version"
          done
          sha256sum kwakore-linux-amd64.tar.gz kwakore-linux-arm64.tar.gz >SHA256SUMS
          sha256sum --strict -c SHA256SUMS

          manifest=$(ls -A | LC_ALL=C sort | tr '\n' ' ')
          [ "$manifest" = "SHA256SUMS kwakore-linux-amd64.tar.gz kwakore-linux-arm64.tar.gz " ] ||
            { echo "unexpected release files: $manifest"; exit 1; }
          old='verd''ana'
          for arch in "${archs[@]}"; do
            archive="kwakore-linux-$arch.tar.gz"
            top="kwakore-$VERSION-linux-$arch"
            members=$(tar -tzf "$archive" | LC_ALL=C sort | tr '\n' ' ')
            [ "$members" = "$top/kwak $top/kwaklet $top/kwakore $top/libwebview.so " ] ||
              { echo "$archive does not hold exactly the four bundle files: $members"; exit 1; }
            if tar -tvzf "$archive" | grep -v '^-'; then
              echo "$archive holds a member that is not a regular file"
              exit 1
            fi
            if tar -tzf "$archive" | grep -i "$old"; then
              echo "$archive names the old product"
              exit 1
            fi
            # the same lookup scripts/install.sh does before it trusts a download
            expected=$(awk -v name="$archive" '{ f = $2; sub(/^\*/, "", f) } NF == 2 && f == name { print $1 }' SHA256SUMS)
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] && [ "$(sha256sum "$archive" | cut -d' ' -f1)" = "$expected" ] ||
              { echo "installer checksum lookup fails for $archive"; exit 1; }
          done
          if ls -A | grep -i "$old"; then
            echo "the release names the old product"
            exit 1
          fi
          cat SHA256SUMS

      # The only step with a write token: pinned to a commit so a moved tag
      # cannot swap the archives and SHA256SUMS together.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/kwakore-linux-amd64.tar.gz
            dist/kwakore-linux-arm64.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
