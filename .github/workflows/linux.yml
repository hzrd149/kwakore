name: linux

# Kwakore is a per-user Linux service: kwakore-daemon, the kwakore CLI, the
# napplet child and libwebview.so, shipped side by side. Every lane here builds
# and tests only those paths; there is no Windows, macOS, Android or Gio
# launcher build any more (D-09, D-10).

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail, so a failing test in front of a tee fails the step
    shell: bash

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # the napplet frame-scope and host-page tests run in node; the runner
      # image ships it, and this fails fast if it ever stops doing so
      - name: check node
        run: node --version

      - name: vet backend
        working-directory: backend
        run: go vet ./...

      - name: test backend
        working-directory: backend
        # node-backed tests must not skip silently in CI
        env:
          KWAKORE_REQUIRE_NODE: "1"
        run: go test ./...

      - name: check shell scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      # the runtime sources carry only reviewed uses of the old product name;
      # the full scan joins once the docs rewrite (09-10) lands
      - name: product identity (runtime)
        run: bash scripts/check-product-identity.sh --runtime-only

  child:
    name: child
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-build-deps

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      # the child loads libwebview.so from beside itself; the copies come from
      # the pinned go-webview module and are never committed
      - name: generate libwebview copies
        working-directory: desktop
        run: go generate ./internal/webviewlib

      - name: build napplet child
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: go build -o child/napplet ./child

      - name: vet desktop
        working-directory: desktop
        run: go vet ./...

      - name: test desktop
        working-directory: desktop
        run: go test ./...

  # the real napplet child on a real WebKitGTK under xvfb. Both steps fail on a
  # missing prerequisite instead of skipping, and both require PASS lines, so
  # a skipped graphical test can never let this job pass.
  graphical:
    name: graphical
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-build-deps

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            backend/go.sum

      - name: generate libwebview copies
        working-directory: desktop
        run: go generate ./internal/webviewlib

      - name: build napplet child
        working-directory: desktop
        env:
          CGO_ENABLED: "1"
        run: go build -o child/napplet ./child

      - name: install graphical test display
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: test real daemon child
        working-directory: backend
        env:
          KWAKORE_REQUIRE_GRAPHICS: "1"
          KWAKORE_WINDOW_BIN: ${{ github.workspace }}/desktop/child/napplet
          KWAKORE_WEBVIEW_LIB: ${{ github.workspace }}/desktop/internal/webviewlib/lib/linux_amd64/libwebview.so
          NO_AT_BRIDGE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a go test -v ./daemon -run '^TestRPCRealChildGraphical$' -count=1 -timeout 60s | tee "$RUNNER_TEMP/kwakore-real-child.log"
          grep -Fq -- '--- PASS: TestRPCRealChildGraphical' "$RUNNER_TEMP/kwakore-real-child.log"

      # the child under WebKitGTK with a fake launcher on the wire protocol:
      # the adversarial napplet's escapes, the rebuild order, the reload cap
      # and the forged bindings. KWAKORE_WEBKIT_SMOKE=1 turns a missing display
      # or engine into a failure; every TestWebKit* must also print PASS.
      - name: webkit smoke
        working-directory: desktop
        env:
          KWAKORE_WEBKIT_SMOKE: "1"
          NO_AT_BRIDGE: "1"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/kwakore-webkit.log"
          go test ./child -list '^TestWebKit' | grep '^TestWebKit' >"$RUNNER_TEMP/kwakore-webkit.tests"
          [ -s "$RUNNER_TEMP/kwakore-webkit.tests" ] || { echo "no TestWebKit tests found"; exit 1; }
          xvfb-run -a go test ./child -run '^TestWebKit' -count=1 -v -timeout 10m | tee "$log"
          if grep -E -- '--- SKIP' "$log"; then
            echo "a real-engine test skipped; KWAKORE_WEBKIT_SMOKE is not reaching it"
            exit 1
          fi
          while read -r name; do
            grep -Eq -- "^--- PASS: $name \\(" "$log" || { echo "missing PASS for $name"; exit 1; }
          done <"$RUNNER_TEMP/kwakore-webkit.tests"

  nix:
    name: nix
    runs-on: ubuntu-24.04
    steps:
      # full history: Nix refuses shallow git trees as flake sources
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: evaluate NixOS module
        run: |
          result=$(nix eval --impure --json --file nix/module-test.nix)
          [ "$result" = true ] || { echo "nix/module-test.nix printed $result, not true"; exit 1; }

      # the Go module vendor trees are fixed-output fetches from the module
      # proxy, which occasionally fail on a resolver hiccup; retry those only
      - name: build package
        run: |
          for attempt in 1 2 3; do
            if nix build -L --no-link .#packages.x86_64-linux.kwakore; then
              exit 0
            fi
            echo "nix build attempt $attempt failed"
            sleep 15
          done
          exit 1

      - name: flake check
        run: |
          nix flake check -L
          nix flake check --all-systems --no-build

  # an isolated per-user systemd manager (scripts/ci-user-manager.sh) runs the
  # socket activation and installer smokes against real user units
  service:
    name: user service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-build-deps

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            backend/go.sum

      - name: activation smoke
        run: |
          log="$RUNNER_TEMP/kwakore-activation.log"
          bash scripts/ci-user-manager.sh bash scripts/smoke-linux-service.sh --activation-only | tee "$log"
          for marker in activation control; do
            want=$(grep -c "pass \"$marker:" scripts/smoke-linux-service.sh)
            got=$(grep -c "^PASS $marker:" "$log" || true)
            [ "$want" -gt 0 ] && [ "$got" = "$want" ] || { echo "expected $want PASS $marker lines, got $got"; exit 1; }
          done

      - name: install smoke
        run: |
          log="$RUNNER_TEMP/kwakore-install.log"
          bash scripts/ci-user-manager.sh bash scripts/smoke-linux-service.sh --install-only | tee "$log"
          want=$(grep -c 'pass "install:' scripts/smoke-linux-service.sh)
          got=$(grep -c '^PASS install:' "$log" || true)
          [ "$want" -gt 0 ] && [ "$got" = "$want" ] || { echo "expected $want PASS install lines, got $got"; exit 1; }

  # one native job per architecture; each writes only its own archive name,
  # so the two never race on an output file
  bundle:
    name: bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-build-deps

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            backend/go.sum

      # two builds into fresh directories must give the same bytes, exactly
      # the four files, a matching SHA256SUMS and a child that refuses a bad
      # WEBVIEW_PATH and resolves WebKitGTK on this host
      - name: bundle smoke
        run: |
          log="$RUNNER_TEMP/kwakore-bundle.log"
          bash scripts/smoke-linux-service.sh --bundle-only | tee "$log"
          for marker in bundle child; do
            want=$(grep -c "pass \"$marker:" scripts/smoke-linux-service.sh)
            got=$(grep -c "^PASS $marker:" "$log" || true)
            [ "$want" -gt 0 ] && [ "$got" = "$want" ] || { echo "expected $want PASS $marker lines, got $got"; exit 1; }
          done

      - name: build release bundle
        env:
          ARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$(uname -m)" in
          x86_64) host=amd64 ;;
          aarch64) host=arm64 ;;
          *) echo "unexpected runner machine $(uname -m)"; exit 1 ;;
          esac
          [ "$host" = "$ARCH" ] || { echo "runner is $host, matrix wants $ARCH"; exit 1; }
          # tags give the release version (stamped into kwakore/backend.Version
          # and the daemon's version output); other runs a commit version
          if [ "$REF_TYPE" = tag ]; then
            version=$REF_NAME
          else
            version="0.0.0-$(git rev-parse --short=12 HEAD)"
          fi
          bash scripts/build-linux-bundle.sh --arch "$ARCH" --version "$version" --out "$RUNNER_TEMP/dist"
          release="$RUNNER_TEMP/dist/$version"
          (cd "$release" && sha256sum --strict -c SHA256SUMS)
          [ "$("$release/kwakore-$version-linux-$ARCH/kwakore-daemon" version)" = "$version" ] ||
            { echo "bundled daemon does not report $version"; exit 1; }
          mkdir "$RUNNER_TEMP/upload"
          cp "$release/kwakore-linux-$ARCH.tar.gz" "$RUNNER_TEMP/upload/"
          # this job's own checksum line; the release job joins both
          cp "$release/SHA256SUMS" "$RUNNER_TEMP/upload/kwakore-linux-$ARCH.sha256"
          printf '%s\n' "$version" >"$RUNNER_TEMP/upload/kwakore-linux-$ARCH.version"

      - uses: actions/upload-artifact@v4
        with:
          name: kwakore-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/upload/*
          if-no-files-found: error

  release:
    name: release
    needs: [backend, child, graphical, nix, service, bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kwakore-linux-*
          path: dist
          merge-multiple: true

      # The published names are what scripts/install.sh downloads:
      # kwakore-linux-ARCH.tar.gz verified against SHA256SUMS. Anything else,
      # including an archive of the old product, fails the release.
      - name: assemble release manifest
        working-directory: dist
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archs=(amd64 arm64)
          for arch in "${archs[@]}"; do
            [ "$(cat "kwakore-linux-$arch.version")" = "$VERSION" ] ||
              { echo "kwakore-linux-$arch was built as $(cat "kwakore-linux-$arch.version"), not $VERSION"; exit 1; }
            [ "$(wc -l <"kwakore-linux-$arch.sha256")" = 1 ] || { echo "kwakore-linux-$arch.sha256 is not one line"; exit 1; }
            sha256sum --strict -c "kwakore-linux-$arch.sha256"
            rm "kwakore-linux-$arch.sha256" "kwakore-linux-$arch.version"
          done
          sha256sum kwakore-linux-amd64.tar.gz kwakore-linux-arm64.tar.gz >SHA256SUMS
          sha256sum --strict -c SHA256SUMS

          manifest=$(ls -A | LC_ALL=C sort | tr '\n' ' ')
          [ "$manifest" = "SHA256SUMS kwakore-linux-amd64.tar.gz kwakore-linux-arm64.tar.gz " ] ||
            { echo "unexpected release files: $manifest"; exit 1; }
          old='verd''ana'
          for arch in "${archs[@]}"; do
            archive="kwakore-linux-$arch.tar.gz"
            top="kwakore-$VERSION-linux-$arch"
            members=$(tar -tzf "$archive" | LC_ALL=C sort | tr '\n' ' ')
            [ "$members" = "$top/kwakore $top/kwakore-daemon $top/libwebview.so $top/napplet " ] ||
              { echo "$archive does not hold exactly the four bundle files: $members"; exit 1; }
            if tar -tvzf "$archive" | grep -v '^-'; then
              echo "$archive holds a member that is not a regular file"
              exit 1
            fi
            if tar -tzf "$archive" | grep -i "$old"; then
              echo "$archive names the old product"
              exit 1
            fi
            # the same lookup scripts/install.sh does before it trusts a download
            expected=$(awk -v name="$archive" '{ f = $2; sub(/^\*/, "", f) } NF == 2 && f == name { print $1 }' SHA256SUMS)
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] && [ "$(sha256sum "$archive" | cut -d' ' -f1)" = "$expected" ] ||
              { echo "installer checksum lookup fails for $archive"; exit 1; }
          done
          if ls -A | grep -i "$old"; then
            echo "the release names the old product"
            exit 1
          fi
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kwakore-linux-amd64.tar.gz
            dist/kwakore-linux-arm64.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
