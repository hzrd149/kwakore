name: linux build deps
description: cgo toolchain and the GTK 3 / WebKitGTK 4.1 the napplet child and libwebview.so link

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc pkg-config \
          libgtk-3-dev libwebkit2gtk-4.1-dev
